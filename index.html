<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Список бажань</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <h1>Список бажань</h1>
      <nav>
        <ul class="nav-list">
          <li><a href="#add-wish-section">Додати бажання</a></li>
          <li><a href="#wish-list-section">Мої бажання</a></li>
          <li><a href="#summary-aside">Підсумок</a></li>
        </ul>
      </nav>
    </header>

    <div class="page-wrapper">
      <main>
        <section id="add-wish-section" class="add-wish-section">
          <h2>Додати бажання</h2>
          <form class="wish-form">
            <div class="form-group">
              <label for="wish-name">Назва речі:</label>
              <input
                type="text"
                id="wish-name"
                placeholder="Наприклад, Навушники"
                required
              />
            </div>

            <div class="form-group">
              <label for="wish-price">Ціна (грн):</label>
              <input
                type="number"
                id="wish-price"
                placeholder="1500"
                min="0"
                required
              />
            </div>

            <div class="form-group">
              <label for="wish-priority">Пріоритет:</label>
              <select id="wish-priority">
                <option value="low">Низький</option>
                <option value="medium" selected>Середній</option>
                <option value="high">Високий</option>
              </select>
            </div>

            <div class="form-group">
              <label for="wish-img">Зображення речі (URL):</label>
              <input type="url" id="wish-img" placeholder="URL зображення" />
            </div>

            <button type="submit" class="btn-add">Додати до списку</button>
          </form>
        </section>

        <section id="wish-list-section">
          <h2>Мої бажання</h2>

          <!-- Додано id="wishlist" до контейнера -->
          <div class="cards" id="wishlist">
            <!-- Статичний приклад для орієнтиру структури (буде видалено програмно) -->
            <article class="card">
              <span class="priority-badge priority-badge--medium"
                >Середній пріоритет</span
              >
              <h3 class="card-title">Бездротові навушники</h3>
              <p class="card-price">3 500 грн</p>
            </article>
          </div>
        </section>
      </main>

      <aside id="summary-aside" class="summary-box">
        <h2>Підсумкова сума</h2>
        <p>Загальна вартість усіх бажань:</p>
        <!-- Додано id="total-price" для динамічного оновлення -->
        <p id="total-price" class="total-amount"></p>
      </aside>
    </div>

    <footer>
      <p>&copy; 2026 Навчальний проєкт «Список бажань».</p>
    </footer>
  </body>
</html>
