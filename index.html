<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Список бажань</title>
    <link rel="stylesheet" href="css/style.css" />

    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel" src="js/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <h1>Список бажань</h1>
      <nav>
        <ul class="nav-list">
          <li><a href="#add-wish-section">Додати бажання</a></li>
          <li><a href="#wish-list-section">Мої бажання</a></li>
          <li><a href="#summary-aside">Підсумок</a></li>
        </ul>
      </nav>
    </header>

    <div class="page-wrapper">
      <main>
        <section id="add-wish-section" class="add-wish-section">
          <h2>Додати бажання</h2>
          <form id="wish-form">
            <div class="form-group">
              <label for="wish-name">Назва речі:</label>
              <input
                type="text"
                id="wish-name"
                placeholder="Наприклад, Навушники"
                required
              />
            </div>
            <div class="form-group">
              <label for="wish-price">Ціна (грн):</label>
              <input
                type="number"
                id="wish-price"
                placeholder="1500"
                min="0"
                required
              />
            </div>
            <div class="form-group">
              <label for="wish-priority">Пріоритет:</label>
              <select id="wish-priority">
                <option value="low">Низький</option>
                <option value="medium" selected>Середній</option>
                <option value="high">Високий</option>
              </select>
            </div>
            <div class="form-group">
              <label for="wish-url"
                >Посилання на товар або зображення (URL):</label
              >
              <input
                type="url"
                id="wish-url"
                placeholder="https://example.com/item"
              />
            </div>
            <button type="submit" class="btn-add" style="margin-top: 1rem">
              Додати до списку
            </button>
          </form>
        </section>

        <section id="wish-list-section">
          <h2>Мої бажання</h2>
          <div id="root"></div>
        </section>
      </main>

      <aside id="summary-aside" class="summary-box">
        <h2>Підсумкова сума</h2>
        <p>Загальна вартість усіх бажань:</p>
        <p id="total-price" class="total-amount">0 грн</p>

        <form class="budget-box" id="budget-form" autocomplete="off">
          <label for="current-budget">Поточний бюджет (грн):</label>
          <div class="budget-row">
            <input
              type="number"
              id="current-budget"
              min="0"
              step="100"
              placeholder="Наприклад, 5000"
              inputmode="numeric"
            />
          </div>
        </form>

        <p class="progress-label">
          Накопичено на купівлю: <span id="progress-percent">0</span>%
        </p>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="progress-hint" id="progress-hint"></p>
      </aside>
    </div>

    <footer>
      <p>&copy; 2026 Навчальний проєкт «Список бажань».</p>
    </footer>
  </body>
</html>
